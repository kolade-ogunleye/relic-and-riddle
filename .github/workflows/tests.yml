name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg libfribidi0 libfontconfig1 libgl1 libegl1
      - name: uv (the version pyproject.toml requires)
        run: pip install uv==0.13.7
      - name: The lock is current for pyproject.toml
        run: uv lock --check
      - name: Install the hashed lock (requirements.txt and the dev group)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/locked.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
      - name: requirements.txt (the production install source) agrees with uv.lock
        run: python scripts/check_lock.py
      - name: Dependency advisories (fails on any advisory)
        run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner off -r "$RUNNER_TEMP/locked.txt"
      - name: Dev tools
        run: python -m ruff --version
      - run: python -m pytest -q -n 4
      - name: Windows launcher adapter tests (the installed runtime/ copy)
        working-directory: deployment/windows/runtime
        run: python -m unittest discover -s tests -p "test_*.py" -v
